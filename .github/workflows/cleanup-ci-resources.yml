---
name: Clean up stale CI resources

permissions:
  contents: read

on: # yamllint disable-line rule:truthy
  schedule:
    # Every 2 hours at 8 minutes past
    - cron: "8 0/2 * * *"
  workflow_dispatch:
    # yamllint disable-line rule:line-length
    # checkov:skip=CKV_GHA_7: "The build output cannot be affected by user parameters other than the build entry point and the top-level source location. GitHub Actions workflow_dispatch inputs MUST be empty. "
    inputs:
      delete-resources:
        type: boolean
        description: "Delete old disposable resources in the CI project"
        required: true
        default: false
      delete-all-keypairs:
        type: boolean
        description: "Delete unused CI keypairs"
        required: true
        default: false
      target-cloud:
        description: >-
          The cloud to target for the run.
          Select default to use the repository's target cloud.
        type: string
        required: false
        default: ""

concurrency:
  group: cleanup-ci-resources-${{ inputs.target-cloud || vars.TARGET_CLOUD || 'default' }}
  cancel-in-progress: false

jobs:
  ci-cleanup:
    name: Clean up stale CI resources
    if: github.repository == 'azimuth-cloud/azimuth-config'
    runs-on: ubuntu-latest
    env:
      OS_CLOUD: ${{ inputs.target-cloud || vars.TARGET_CLOUD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Generate clouds.yaml
        run: |
          umask 077
          printf '%s\n' "$OS_CLOUDS" > clouds.yaml
        env:
          OS_CLOUDS: ${{ secrets.OS_CLOUDS }}

      - name: Install OpenStack SDK
        run: python -m pip install 'openstacksdk>=4,<5'

      - name: Clean up stale CI resources
        run: |
          args=()
          if [[ "$DELETE_RESOURCES" == "true" ]]; then
            args+=(--delete-resources)
          fi
          if [[ "$DELETE_ALL_KEYPAIRS" == "true" ]]; then
            args+=(--delete-all-keypairs)
          fi
          python bin/cleanup-ci-resources "${args[@]}"
        env:
          # A branch dispatch can inspect candidates; only the default branch can delete resources.
          DELETE_RESOURCES: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
                && (github.event_name == 'schedule' || inputs.delete-resources) }}
          DELETE_ALL_KEYPAIRS: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
                && inputs.delete-all-keypairs || false }}
