name: Publish release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag name for the release e.g. 2025.11.0'
        required: true
        type: string

jobs:
  generate_release_notes:
    name: Generate consolidated release notes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install easysemver requests pyyaml

      - name: Generate and update release notes
        run: |
          python ./.github/actions/release-notes/release-notes.py /
            --token ${{ github.token }} /
            --repo ${{ github.repository }} /
            ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
