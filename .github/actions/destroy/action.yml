---
name: Azimuth CI destroy
description: Destroys an Azimuth CI environment.
runs:
  using: composite
  steps:
    - name: Destroy Azimuth
      shell: bash
      run: |
        set -e
        source ./ci.env
        source ./bin/activate "$AZIMUTH_CONFIG_ENVIRONMENT" "$AZIMUTH_ENVIRONMENT"
        ansible-playbook azimuth_cloud.azimuth_ops.destroy \
          -e @extra-vars.yml \
          -e force_destroy=true \
          -e capi_cluster_volumes_policy=delete
      if: ${{ always() }}

    - name: Release floating IPs
      shell: bash
      run: |
        set -eo pipefail
        source ci.env
        source ./bin/activate "$AZIMUTH_CONFIG_ENVIRONMENT" "$AZIMUTH_ENVIRONMENT"
        python - <<'PY'
        import os
        import sys

        import openstack

        connection = openstack.connect()
        project_id = connection.current_project_id
        environment = os.environ["AZIMUTH_ENVIRONMENT"]
        if not project_id or not environment:
            raise SystemExit("Cannot release CI floating IPs without a project and environment")

        failed = False
        for variable, purpose in (("INGRESS_IP", "ingress"), ("ZENITH_SSHD_IP", "Zenith SSHD")):
            address = os.environ.get(variable)
            if not address:
                continue
            try:
                ips = list(connection.network.ips(project_id=project_id, floating_ip_address=address))
                for ip in ips:
                    # The address may have been released and reallocated to another CI run.
                    if (
                        ip.project_id != project_id
                        or ip.floating_ip_address != address
                        or ip.description != f"{purpose} IP for {environment}"
                    ):
                        raise RuntimeError("Floating IP is no longer owned by this CI environment")
                    connection.network.delete_ip(ip.id, ignore_missing=True)
                print(f"Released {purpose} floating IP, or it was already absent")
            except Exception as exc:
                # Still try the other allocation; do not print potentially sensitive API responses.
                print(f"Failed to release {purpose} floating IP: {type(exc).__name__}", file=sys.stderr)
                failed = True
        raise SystemExit(1 if failed else 0)
        PY
      if: ${{ always() }}

    - name: Configure S3 lock
      id: s3-lock-config
      shell: bash
      run: |
        set -e
        source ci.env
        source ./bin/activate "$AZIMUTH_CONFIG_ENVIRONMENT" "$AZIMUTH_ENVIRONMENT"
        if [ -z "$CI_S3_LOCK_HOST" ]; then
          echo "CI_S3_LOCK_HOST not set - no lock will be used"
          exit
        elif [ -z "$CI_S3_LOCK_BUCKET" ]; then
          echo "CI_S3_LOCK_BUCKET is required when using the lock" >&2
          exit 1
        fi
        echo "host=${CI_S3_LOCK_HOST}" >> "$GITHUB_OUTPUT"
        echo "access-key=${CI_S3_LOCK_ACCESS_KEY}" >> "$GITHUB_OUTPUT"
        echo "secret-key=${CI_S3_LOCK_SECRET_KEY}" >> "$GITHUB_OUTPUT"
        echo "bucket=${CI_S3_LOCK_BUCKET}" >> "$GITHUB_OUTPUT"
      if: ${{ always() }}

    - name: Release S3 lock
      uses: azimuth-cloud/github-actions/s3-lock@master
      with:
        host: ${{ steps.s3-lock-config.outputs.host }}
        access-key: ${{ steps.s3-lock-config.outputs.access-key }}
        secret-key: ${{ steps.s3-lock-config.outputs.secret-key }}
        bucket: ${{ steps.s3-lock-config.outputs.bucket }}
        action: release
      if: ${{ steps.s3-lock-config.outputs.host != '' && always() }}

    - name: Delete S3 credential
      shell: bash
      run: |
        set -e
        source ./ci.env
        source ./bin/activate "$AZIMUTH_CONFIG_ENVIRONMENT" "$AZIMUTH_ENVIRONMENT"
        if [ -n "$CI_S3_LOCK_ACCESS_KEY" ]; then
          openstack ec2 credentials delete $CI_S3_LOCK_ACCESS_KEY
        fi
      if: ${{ always() }}
