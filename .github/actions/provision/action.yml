---
name: Azimuth CI provision
description: Provisions an Azimuth environment using the CI config.
inputs:
  debug-bundle-artifact-name:
    description: >
      The name to use for the debug bundle artifact collected if provisioning fails.
    required: true
    default: debug-bundle-provision-failure
runs:
  using: composite
  steps:
    - name: Deploy Azimuth
      shell: bash
      # Make sure to source the ci environment before running the provision
      run: |
        set -e
        source ./ci.env
        source ./bin/activate "$AZIMUTH_CONFIG_ENVIRONMENT" "$AZIMUTH_ENVIRONMENT"
        ansible-playbook azimuth_cloud.azimuth_ops.provision -e @extra-vars.yml

    - name: Create debug bundle on provisioning failure
      shell: bash
      run: |
        set -e
        source ./ci.env
        source ./bin/activate "$AZIMUTH_CONFIG_ENVIRONMENT" "$AZIMUTH_ENVIRONMENT"
        ./bin/create-debug-bundle
      if: ${{ failure() }}

    - name: Upload debug bundle on provisioning failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.debug-bundle-artifact-name }}
        path: debug-bundle.tar.gz
      if: ${{ failure() }}
