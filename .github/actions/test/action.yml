---
name: Azimuth CI tests
description: Tests an Azimuth environment using the CI config.
inputs:
  test-report-artifact-name:
    description: The name to use for the test report artifact.
    required: true
    default: test-report
  debug-bundle-artifact-name:
    description: The name to use for the debug bundle artifact.
    required: true
    default: debug-bundle
runs:
  using: composite
  steps:
    - name: Check expected alerts are pending or firing
      shell: bash
      # Make sure to source the ci environment before running the tests
      run: |
        set -e
        source ./ci.env
        source ./bin/activate "$AZIMUTH_CONFIG_ENVIRONMENT" "$AZIMUTH_ENVIRONMENT"
        ./bin/check-alerts

    - name: Generate test suite
      shell: bash
      # Make sure to source the ci environment before running the provision
      run: |
        set -e
        source ./ci.env
        source ./bin/activate "$AZIMUTH_CONFIG_ENVIRONMENT" "$AZIMUTH_ENVIRONMENT"
        ansible-playbook azimuth_cloud.azimuth_ops.generate_tests -e @extra-vars.yml

    - name: Get latest logcli release
      id: logcli-version
      shell: bash
      # Authenticate to avoid rate limits.
      run: |
        set -e
        echo "version=$(gh release view --repo grafana/loki --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Cache logcli
      id: cache-logcli
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/bin/logcli
        key: logcli-${{ runner.os }}-${{ steps.logcli-version.outputs.version }}

    - name: Install logcli
      shell: bash
      # Authenticate to avoid rate limits.
      run: |
        set -e
        mkdir -p ~/.local/bin
        gh release download "${{ steps.logcli-version.outputs.version }}" \
          --repo grafana/loki \
          --pattern 'logcli-linux-amd64.zip' \
          --output /tmp/logcli.zip \
          --clobber
        unzip -o /tmp/logcli.zip -d /tmp
        chmod +x /tmp/logcli-linux-amd64
        mv /tmp/logcli-linux-amd64 ~/.local/bin/logcli
      env:
        GH_TOKEN: ${{ github.token }}
      if: steps.cache-logcli.outputs.cache-hit != 'true'

    - name: Add logcli to PATH and verify
      shell: bash
      run: |
        set -e
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/logcli" --version

    - name: Run test suite
      shell: bash
      run: |
        set -e
        source ./ci.env
        source ./bin/activate "$AZIMUTH_CONFIG_ENVIRONMENT" "$AZIMUTH_ENVIRONMENT"
        ./bin/run-tests

    - name: Upload test report artifacts
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.test-report-artifact-name }}
        path: |
          output.xml
          log.html
          report.html
          *.tar.gz
          *.json
          *.log
      if: ${{ always() }}

    - name: Clean up test platforms
      shell: bash
      run: |
        set -e
        source ./ci.env
        source ./bin/activate "$AZIMUTH_CONFIG_ENVIRONMENT" "$AZIMUTH_ENVIRONMENT"
        ./bin/run-tests --include delete
      if: ${{ cancelled() }}

    - name: Create debug bundle
      shell: bash
      run: |
        set -e
        source ./ci.env
        source ./bin/activate "$AZIMUTH_CONFIG_ENVIRONMENT" "$AZIMUTH_ENVIRONMENT"
        ./bin/create-debug-bundle
      if: ${{ always() }}

    - name: Upload debug bundle
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.debug-bundle-artifact-name }}
        path: debug-bundle.tar.gz
      if: ${{ always() }}
