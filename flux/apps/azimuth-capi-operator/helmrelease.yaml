---
apiVersion: v1
kind: Namespace
metadata:
  name: azimuth
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: azimuth-capi-operator
  namespace: azimuth
spec:
  interval: 10m
  dependsOn:
    - name: capi-operator
      namespace: capi-operator-system
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: azimuth-capi-operator
      version: "0.18.0"
      sourceRef:
        kind: HelmRepository
        name: azimuth-cloud-capi-operator
        namespace: flux-system
  values:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    # Values injected from sealed secrets or SOPS — override in your environment
    # capiHelmChartRepo: ""
    # capiHelmChartVersion: ""
    # zenithChartRepo: ""
    # zenithChartVersion: ""
