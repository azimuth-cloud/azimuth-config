---
apiVersion: v1
kind: Namespace
metadata:
  name: sealed-secrets-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: sealed-secrets-system
spec:
  interval: 10m
  chart:
    spec:
      chart: sealed-secrets
      version: "2.18.4"
      sourceRef:
        kind: HelmRepository
        name: bitnami-labs
        namespace: flux-system
  values:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
