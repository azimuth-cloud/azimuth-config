---
apiVersion: v1
kind: Namespace
metadata:
  name: capi-janitor-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cluster-api-janitor-openstack
  namespace: capi-janitor-system
spec:
  interval: 10m
  chart:
    spec:
      chart: cluster-api-janitor-openstack
      version: "0.10.6"
      sourceRef:
        kind: HelmRepository
        name: azimuth-cloud-capi-janitor
        namespace: flux-system
  values:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
