---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zenith-server
  namespace: azimuth
spec:
  interval: 10m
  dependsOn:
    - name: ingress-nginx
      namespace: ingress-nginx
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: zenith-server
      version: "0.17.0"
      sourceRef:
        kind: HelmRepository
        name: azimuth-cloud-zenith
        namespace: flux-system
  values:
    global:
      ingress:
        baseDomain: "${base_domain}"
    registrar:
      config:
        subdomainTokenSigningKey: "${zenith_token_signing_key}"
    sshd:
      service:
        type: LoadBalancer
        port: 2222
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
