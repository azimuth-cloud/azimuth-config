---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: azimuth-cluster-addons
  namespace: azimuth-cluster
spec:
  interval: 10m
  chart:
    spec:
      chart: cluster-addons
      version: "0.23.0"
      sourceRef:
        kind: HelmRepository
        name: azimuth-cloud-capi-helm-charts
        namespace: flux-system
  values:
    clusterName: azimuth-cluster

    # ── Infra addons (bootstrap: true — installés avant que le cluster soit prêt) ─

    openstack:
      enabled: true
      csiCinder:
        defaultStorageClass:
          # Override the default "nova" AZ — set empty so Cinder uses its own default AZ
          availabilityZone: ""

    cni:
      enabled: false

    metricsServer:
      enabled: true

    monitoring:
      enabled: true
      kubePrometheusStack:
        values:
          grafana:
            grafana.ini:
              server:
                root_url: https://grafana.${azimuth_cluster_base_domain}
              auth.generic_oauth:
                enabled: true
                name: OpenStack
                allow_sign_up: true
                client_id: grafana
                client_secret: "${dex_grafana_client_secret}"
                scopes: openid email profile groups
                auth_url: https://dex.${azimuth_cluster_base_domain}/auth
                token_url: https://dex.${azimuth_cluster_base_domain}/token
                api_url: https://dex.${azimuth_cluster_base_domain}/userinfo
                role_attribute_path: "contains(groups[*], 'admin') && 'Admin' || 'Viewer'"
            ingress:
              enabled: true
              ingressClassName: nginx
              hosts:
                - grafana.${azimuth_cluster_base_domain}
              tls:
                - hosts:
                    - grafana.${azimuth_cluster_base_domain}
                  secretName: grafana-tls

    etcdDefrag:
      enabled: false

    # ── Apps Azimuth (custom addons) ───────────────────────────────────────────

    custom:
      # Label system namespaces as privileged.
      # Kubernetes PodSecurity baseline (the default for unlabelled namespaces)
      # blocks hostNetwork, hostPath, hostPort, and privileged containers — all
      # of which are required by infrastructure components (CCM, Cinder CSI,
      # ingress-nginx, node-feature-discovery, node-problem-detector, GPU/network
      # operators).
      system-ns-privileged:
        kind: Manifests
        spec:
          namespace: kube-system
          manifests:
            # Apply PSA "privileged" labels to system namespaces declaratively.
            #
            # These Namespace resources are managed by Helm as regular chart resources
            # (not hooks). Helm reconciles them on every install/upgrade, so the labels
            # are always maintained even if something removes them between reconciliations.
            #
            # Bootstrap addons create namespaces via `helm install --create-namespace`,
            # which sets no Helm ownership annotations. Helm can therefore adopt these
            # namespaces without conflict. The `helm.sh/resource-policy: keep` annotation
            # prevents accidental deletion if this chart is ever uninstalled.
            namespace-labels: |
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: openstack-system
                annotations:
                  helm.sh/resource-policy: keep
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ingress-nginx
                annotations:
                  helm.sh/resource-policy: keep
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: node-feature-discovery
                annotations:
                  helm.sh/resource-policy: keep
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: node-problem-detector
                annotations:
                  helm.sh/resource-policy: keep
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: gpu-operator
                annotations:
                  helm.sh/resource-policy: keep
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: network-operator
                annotations:
                  helm.sh/resource-policy: keep
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: monitoring-system
                annotations:
                  helm.sh/resource-policy: keep
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: harbor
                annotations:
                  helm.sh/resource-policy: keep
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged

      cert-manager:
        kind: HelmRelease
        spec:
          namespace: cert-manager
          chart:
            repo: https://charts.jetstack.io
            name: cert-manager
            version: "v1.20.1"
          values:
            installCRDs: true

      ingress-nginx:
        kind: HelmRelease
        spec:
          namespace: ingress-nginx
          chart:
            repo: https://kubernetes.github.io/ingress-nginx
            name: ingress-nginx
            version: "4.15.1"
          values:
            controller:
              hostNetwork: true
              hostPort:
                enabled: true
              service:
                type: ClusterIP

      zenith-server:
        kind: HelmRelease
        spec:
          namespace: azimuth
          chart:
            repo: https://azimuth-cloud.github.io/zenith
            name: zenith-server
            version: "0.17.0"
          values:
            global:
              ingress:
                baseDomain: "${azimuth_cluster_base_domain}"
            registrar:
              config:
                subdomainTokenSigningKey: "${zenith_token_signing_key}"
            sshd:
              replicaCount: 1
              service:
                type: NodePort
                port: 2222
                nodePort: 32222

      azimuth:
        kind: HelmRelease
        spec:
          namespace: azimuth
          chart:
            repo: https://azimuth-cloud.github.io/azimuth
            name: azimuth
            version: "0.20.0"
          values:
            settings:
              secretKey: "${azimuth_django_secret_key}"
            ingress:
              host: "portal.${azimuth_cluster_base_domain}"
            tags:
              apps: true
            apps:
              baseDomain: "${azimuth_cluster_base_domain}"
              sshdHost: "${azimuth_cluster_base_domain}"
              sshdPort: 32222
              registrarExternalUrl: "https://registrar.${azimuth_cluster_base_domain}"
              registrarAdminUrl: "http://zenith-server-registrar.azimuth.svc.cluster.local"
            authentication:
              type: openstack
              openstack:
                authUrl: "${openstack_auth_url}"

      # ── Azimuth operators ─────────────────────────────────────────────────────

      azimuth-capi-operator:
        kind: HelmRelease
        spec:
          namespace: azimuth-capi-operator
          chart:
            repo: https://azimuth-cloud.github.io/azimuth-capi-operator
            name: azimuth-capi-operator
            version: "0.18.0"
          values: {}

      azimuth-apps-operator:
        kind: HelmRelease
        spec:
          namespace: azimuth-apps-operator
          chart:
            repo: https://azimuth-cloud.github.io/azimuth-apps-operator
            name: azimuth-apps-operator
            version: "0.4.2"
          values: {}

      azimuth-caas-operator:
        kind: HelmRelease
        spec:
          namespace: azimuth-caas-operator
          chart:
            repo: https://azimuth-cloud.github.io/azimuth-caas-operator
            name: azimuth-caas-operator
            version: "0.20.0"
          values: {}

      azimuth-identity-operator:
        kind: HelmRelease
        spec:
          namespace: azimuth-identity-operator
          chart:
            repo: https://azimuth-cloud.github.io/azimuth-identity-operator
            name: azimuth-identity-operator
            version: "0.10.0"
          values:
            config:
              keycloak:
                base_url: https://keycloak.${azimuth_cluster_base_domain}
                client_id: admin-cli
                client_realm: master
                username: admin
                password: "${keycloak_admin_password}"

      azimuth-schedule-operator:
        kind: HelmRelease
        spec:
          namespace: azimuth-schedule-operator
          chart:
            repo: https://azimuth-cloud.github.io/azimuth-schedule-operator
            name: azimuth-schedule-operator
            version: "0.8.0"
          values: {}

      # ── CAPI management addons ────────────────────────────────────────────────

      cluster-api-addon-provider:
        kind: HelmRelease
        spec:
          namespace: capi-addon-provider
          chart:
            repo: https://azimuth-cloud.github.io/cluster-api-addon-provider
            name: cluster-api-addon-provider
            version: "0.11.0"
          values: {}

      cluster-api-janitor-openstack:
        kind: HelmRelease
        spec:
          namespace: capi-janitor-system
          chart:
            repo: https://azimuth-cloud.github.io/cluster-api-janitor-openstack
            name: cluster-api-janitor-openstack
            version: "0.10.6"
          values: {}

      sealed-secrets:
        kind: HelmRelease
        spec:
          namespace: sealed-secrets-system
          chart:
            repo: https://bitnami-labs.github.io/sealed-secrets
            name: sealed-secrets
            version: "2.18.4"
          values: {}

      # ── Auth & UI ─────────────────────────────────────────────────────────────

      keycloak:
        kind: Manifests
        spec:
          namespace: keycloak
          manifests:
            postgres: |
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: keycloak
              ---
              apiVersion: v1
              kind: Secret
              metadata:
                name: keycloak-db
                namespace: keycloak
              type: Opaque
              stringData:
                POSTGRES_USER: keycloak
                POSTGRES_PASSWORD: "${keycloak_db_password}"
                POSTGRES_DB: keycloak
              ---
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: keycloak-db
                namespace: keycloak
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 10Gi
              ---
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: keycloak-db
                namespace: keycloak
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: keycloak-db
                template:
                  metadata:
                    labels:
                      app: keycloak-db
                  spec:
                    containers:
                      - name: postgres
                        image: postgres:16-alpine
                        envFrom:
                          - secretRef:
                              name: keycloak-db
                        volumeMounts:
                          - name: data
                            mountPath: /var/lib/postgresql/data
                            subPath: pgdata
                        readinessProbe:
                          exec:
                            command: [pg_isready, -U, keycloak]
                          initialDelaySeconds: 5
                          periodSeconds: 5
                    volumes:
                      - name: data
                        persistentVolumeClaim:
                          claimName: keycloak-db
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: keycloak-db
                namespace: keycloak
              spec:
                selector:
                  app: keycloak-db
                ports:
                  - port: 5432
                    targetPort: 5432
            keycloak-app: |
              ---
              apiVersion: v1
              kind: Secret
              metadata:
                name: keycloak-admin
                namespace: keycloak
              type: Opaque
              stringData:
                KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
                KC_DB_USERNAME: keycloak
                KC_DB_PASSWORD: "${keycloak_db_password}"
                KEYCLOAK_ADMIN: admin
                KEYCLOAK_ADMIN_PASSWORD: "${keycloak_admin_password}"
              ---
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: keycloak
                namespace: keycloak
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: keycloak
                template:
                  metadata:
                    labels:
                      app: keycloak
                  spec:
                    containers:
                      - name: keycloak
                        image: quay.io/keycloak/keycloak:26.0
                        args: ["start"]
                        envFrom:
                          - secretRef:
                              name: keycloak-admin
                        env:
                          - name: KC_HOSTNAME
                            value: keycloak.${azimuth_cluster_base_domain}
                          - name: KC_PROXY_HEADERS
                            value: xforwarded
                          - name: KC_HTTP_ENABLED
                            value: "true"
                          - name: KC_HTTPS_ENABLED
                            value: "false"
                          - name: KC_DB
                            value: postgres
                          - name: KC_HOSTNAME_STRICT
                            value: "false"
                        ports:
                          - containerPort: 8080
                        readinessProbe:
                          httpGet:
                            path: /realms/master
                            port: 8080
                          initialDelaySeconds: 30
                          periodSeconds: 10
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: keycloak
                namespace: keycloak
              spec:
                selector:
                  app: keycloak
                ports:
                  - port: 80
                    targetPort: 8080
              ---
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: keycloak
                namespace: keycloak
              spec:
                ingressClassName: nginx
                rules:
                  - host: keycloak.${azimuth_cluster_base_domain}
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: keycloak
                              port:
                                number: 80
                tls:
                  - hosts:
                      - keycloak.${azimuth_cluster_base_domain}
                    secretName: keycloak-tls

      # Creates the "azimuth" realm and "dex" OIDC client in Keycloak.
      # Values substituted by Flux at render time — no secretKeyRef needed.
      keycloak-init:
        kind: Manifests
        spec:
          namespace: keycloak
          manifests:
            init-job: |
              ---
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: keycloak-init
                namespace: keycloak
              spec:
                backoffLimit: 10
                template:
                  spec:
                    restartPolicy: OnFailure
                    initContainers:
                      - name: wait-keycloak
                        image: curlimages/curl:8.9.1
                        command: ["/bin/sh", "-c"]
                        args:
                          - |
                            until curl -sf http://keycloak/realms/master; do
                              echo "Waiting for Keycloak…"
                              sleep 15
                            done
                    containers:
                      - name: init
                        image: quay.io/keycloak/keycloak:26.0
                        command: ["/bin/sh", "-c"]
                        args:
                          - |
                            /opt/keycloak/bin/kcadm.sh config credentials \
                              --server http://keycloak \
                              --realm master \
                              --user admin \
                              --password ${keycloak_admin_password}

                            /opt/keycloak/bin/kcadm.sh get realms/azimuth \
                              >/dev/null 2>&1 || \
                              /opt/keycloak/bin/kcadm.sh create realms \
                                -s realm=azimuth \
                                -s enabled=true

                            /opt/keycloak/bin/kcadm.sh get clients -r azimuth \
                              --fields clientId 2>/dev/null | grep -q '"dex"' || \
                              /opt/keycloak/bin/kcadm.sh create clients -r azimuth \
                                -s clientId=dex \
                                -s secret=${keycloak_dex_client_secret} \
                                -s 'redirectUris=["https://dex.${azimuth_cluster_base_domain}/callback"]' \
                                -s standardFlowEnabled=true \
                                -s publicClient=false \
                                -s enabled=true

                            echo "Keycloak init done."

      dex:
        kind: HelmRelease
        spec:
          namespace: dex
          chart:
            repo: https://charts.dexidp.io
            name: dex
            version: "0.6.4"
          values:
            config:
              issuer: https://dex.${azimuth_cluster_base_domain}
              storage:
                type: kubernetes
                config:
                  inCluster: true
              oauth2:
                skipApprovalScreen: true
              connectors:
                - type: oidc
                  id: keycloak
                  name: Keycloak
                  config:
                    issuer: https://keycloak.${azimuth_cluster_base_domain}/realms/azimuth
                    clientID: dex
                    clientSecret: "${keycloak_dex_client_secret}"
                    redirectURI: https://dex.${azimuth_cluster_base_domain}/callback
                    scopes:
                      - openid
                      - profile
                      - email
                      - groups
              staticClients:
                - id: harbor
                  name: Harbor
                  secret: "${dex_harbor_client_secret}"
                  redirectURIs:
                    - https://harbor.${azimuth_cluster_base_domain}/c/oidc/callback
                - id: grafana
                  name: Grafana
                  secret: "${dex_grafana_client_secret}"
                  redirectURIs:
                    - https://grafana.${azimuth_cluster_base_domain}/login/generic_oauth
            ingress:
              enabled: true
              className: nginx
              hosts:
                - host: dex.${azimuth_cluster_base_domain}
                  paths:
                    - path: /
                      pathType: Prefix
              tls:
                - hosts:
                    - dex.${azimuth_cluster_base_domain}
                  secretName: dex-tls

      harbor:
        kind: HelmRelease
        spec:
          namespace: harbor
          chart:
            repo: https://helm.goharbor.io
            name: harbor
            version: "1.18.3"
          values:
            expose:
              type: ingress
              ingress:
                hosts:
                  core: harbor.${azimuth_cluster_base_domain}
                className: nginx
              tls:
                enabled: true
                certSource: auto
            externalURL: https://harbor.${azimuth_cluster_base_domain}
            harborAdminPassword: "${harbor_admin_password}"

      # Configures Harbor OIDC auth via the admin API after Harbor is running.
      # Harbor does not expose OIDC settings as Helm values — API call required.
      # All secrets are Flux-substituted at render time (no secretKeyRef needed).
      harbor-oidc-config:
        kind: Manifests
        spec:
          namespace: harbor
          manifests:
            configure-job: |
              ---
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: harbor-oidc-configure
                namespace: harbor
              spec:
                backoffLimit: 10
                template:
                  spec:
                    restartPolicy: OnFailure
                    initContainers:
                      - name: wait-harbor
                        image: curlimages/curl:8.9.1
                        command: ["/bin/sh", "-c"]
                        args:
                          - |
                            until curl -sf \
                              -u "admin:${harbor_admin_password}" \
                              https://harbor.${azimuth_cluster_base_domain}/api/v2.0/systeminfo; do
                              echo "Waiting for Harbor…"
                              sleep 15
                            done
                    containers:
                      - name: configure
                        image: curlimages/curl:8.9.1
                        command: ["/bin/sh", "-c"]
                        args:
                          - |
                            curl -sf -X PUT \
                              -u "admin:${harbor_admin_password}" \
                              -H "Content-Type: application/json" \
                              https://harbor.${azimuth_cluster_base_domain}/api/v2.0/configurations \
                              -d '{
                                "auth_mode": "oidc_auth",
                                "oidc_name": "OpenStack",
                                "oidc_endpoint": "https://dex.${azimuth_cluster_base_domain}",
                                "oidc_client_id": "harbor",
                                "oidc_client_secret": "${dex_harbor_client_secret}",
                                "oidc_scope": "openid,profile,email,groups",
                                "oidc_auto_onboard": true,
                                "oidc_user_claim": "preferred_username"
                              }'
                            echo "Harbor OIDC configured."

      kubernetes-dashboard:
        kind: HelmRelease
        spec:
          namespace: kubernetes-dashboard
          chart:
            repo: https://kubernetes.github.io/dashboard
            name: kubernetes-dashboard
            version: "7.14.0"
          values: {}

      helm-dashboard:
        kind: HelmRelease
        spec:
          namespace: helm-dashboard
          chart:
            repo: https://helm-charts.komodor.io
            name: helm-dashboard
            version: "2.0.4"
          values: {}
