---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: azimuth-cluster-addons
  namespace: azimuth-cluster
spec:
  interval: 10m
  chart:
    spec:
      chart: cluster-addons
      version: "0.23.0"
      sourceRef:
        kind: HelmRepository
        name: azimuth-cloud-capi-helm-charts
        namespace: flux-system
  values:
    clusterName: azimuth-cluster

    # ── Infra addons (bootstrap: true — installés avant que le cluster soit prêt) ─

    openstack:
      enabled: true

    cni:
      enabled: false

    metricsServer:
      enabled: true

    etcdDefrag:
      enabled: false

    # ── Apps Azimuth (custom addons) ───────────────────────────────────────────

    custom:
      # Label system namespaces as privileged.
      # Kubernetes PodSecurity baseline (the default for unlabelled namespaces)
      # blocks hostNetwork, hostPath, hostPort, and privileged containers — all
      # of which are required by infrastructure components (CCM, Cinder CSI,
      # ingress-nginx, node-feature-discovery, node-problem-detector, GPU/network
      # operators).
      system-ns-privileged:
        kind: Manifests
        spec:
          namespace: kube-system
          manifests:
            namespaces: |
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ingress-nginx
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: openstack-system
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: node-feature-discovery
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: node-problem-detector
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: gpu-operator
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: network-operator
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged

      cert-manager:
        kind: HelmRelease
        spec:
          namespace: cert-manager
          chart:
            repo: https://charts.jetstack.io
            name: cert-manager
            version: "v1.20.1"
          values:
            installCRDs: true

      ingress-nginx:
        kind: HelmRelease
        spec:
          namespace: ingress-nginx
          chart:
            repo: https://kubernetes.github.io/ingress-nginx
            name: ingress-nginx
            version: "4.15.1"
          values:
            controller:
              hostNetwork: true
              hostPort:
                enabled: true
              service:
                type: ClusterIP

      zenith-server:
        kind: HelmRelease
        spec:
          namespace: azimuth
          chart:
            repo: https://azimuth-cloud.github.io/zenith
            name: zenith-server
            version: "0.17.0"
          values:
            global:
              ingress:
                baseDomain: "${azimuth_cluster_base_domain}"
            registrar:
              config:
                subdomainTokenSigningKey: "${zenith_token_signing_key}"
            sshd:
              replicaCount: 1
              service:
                type: NodePort
                port: 2222
                nodePort: 32222

      azimuth:
        kind: HelmRelease
        spec:
          namespace: azimuth
          chart:
            repo: https://azimuth-cloud.github.io/azimuth
            name: azimuth
            version: "0.20.0"
          values:
            settings:
              secretKey: "${azimuth_django_secret_key}"
            ingress:
              host: "portal.${azimuth_cluster_base_domain}"
            tags:
              apps: true
            apps:
              baseDomain: "${azimuth_cluster_base_domain}"
              sshdHost: "${azimuth_cluster_base_domain}"
              sshdPort: 32222
              registrarExternalUrl: "https://registrar.${azimuth_cluster_base_domain}"
              registrarAdminUrl: "http://zenith-server-registrar.azimuth.svc.cluster.local"
            authentication:
              type: openstack
              openstack:
                authUrl: "${openstack_auth_url}"
