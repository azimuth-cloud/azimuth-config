---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: azimuth-cluster-addons
  namespace: azimuth-cluster
spec:
  interval: 10m
  chart:
    spec:
      chart: cluster-addons
      version: "0.23.0"
      sourceRef:
        kind: HelmRepository
        name: azimuth-cloud-capi-helm-charts
        namespace: flux-system
  values:
    clusterName: azimuth-cluster

    # ── Infra addons (bootstrap: true — installés avant que le cluster soit prêt) ─

    openstack:
      enabled: true
      csiCinder:
        defaultStorageClass:
          # Override the default "nova" AZ — set empty so Cinder uses its own default AZ
          availabilityZone: ""

    cni:
      enabled: false

    metricsServer:
      enabled: true

    monitoring:
      enabled: true

    etcdDefrag:
      enabled: false

    # ── Apps Azimuth (custom addons) ───────────────────────────────────────────

    custom:
      # Label system namespaces as privileged.
      # Kubernetes PodSecurity baseline (the default for unlabelled namespaces)
      # blocks hostNetwork, hostPath, hostPort, and privileged containers — all
      # of which are required by infrastructure components (CCM, Cinder CSI,
      # ingress-nginx, node-feature-discovery, node-problem-detector, GPU/network
      # operators).
      system-ns-privileged:
        kind: Manifests
        spec:
          namespace: kube-system
          manifests:
            # Pre-install hook: adopt any pre-existing namespaces into this Helm release.
            # Bootstrap addons create namespaces via `helm install --create-namespace`,
            # which sets no Helm ownership labels. Without adoption, Helm refuses to
            # manage those namespaces and the install fails.
            hook-rbac: |
              ---
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: ns-labeler
                namespace: kube-system
                annotations:
                  helm.sh/hook: pre-install,pre-upgrade
                  helm.sh/hook-weight: "-10"
                  helm.sh/hook-delete-policy: before-hook-creation
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: ns-labeler
                annotations:
                  helm.sh/hook: pre-install,pre-upgrade
                  helm.sh/hook-weight: "-10"
                  helm.sh/hook-delete-policy: before-hook-creation
              rules:
                - apiGroups: [""]
                  resources: ["namespaces"]
                  verbs: ["get", "list", "patch", "update"]
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: ns-labeler
                annotations:
                  helm.sh/hook: pre-install,pre-upgrade
                  helm.sh/hook-weight: "-10"
                  helm.sh/hook-delete-policy: before-hook-creation
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: ns-labeler
              subjects:
                - kind: ServiceAccount
                  name: ns-labeler
                  namespace: kube-system
            hook-adopt: |
              ---
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: ns-adopt
                namespace: kube-system
                annotations:
                  helm.sh/hook: pre-install,pre-upgrade
                  helm.sh/hook-weight: "0"
                  helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
              spec:
                backoffLimit: 3
                template:
                  spec:
                    serviceAccountName: ns-labeler
                    restartPolicy: OnFailure
                    containers:
                      - name: adopter
                        image: bitnami/kubectl:1.32
                        command: ["/bin/sh", "-c"]
                        args:
                          - |
                            for ns in ingress-nginx openstack-system node-feature-discovery node-problem-detector gpu-operator network-operator monitoring-system harbor; do
                              kubectl get ns "$ns" >/dev/null 2>&1 || continue
                              kubectl annotate ns "$ns" \
                                meta.helm.sh/release-name=system-ns-privileged \
                                meta.helm.sh/release-namespace=kube-system \
                                --overwrite
                              kubectl label ns "$ns" app.kubernetes.io/managed-by=Helm --overwrite
                              echo "Adopted: $ns"
                            done
            namespaces: |
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ingress-nginx
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: openstack-system
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: node-feature-discovery
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: node-problem-detector
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: gpu-operator
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: network-operator
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: monitoring-system
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged
              ---
              apiVersion: v1
              kind: Namespace
              metadata:
                name: harbor
                labels:
                  pod-security.kubernetes.io/enforce: privileged
                  pod-security.kubernetes.io/audit: privileged
                  pod-security.kubernetes.io/warn: privileged

      cert-manager:
        kind: HelmRelease
        spec:
          namespace: cert-manager
          chart:
            repo: https://charts.jetstack.io
            name: cert-manager
            version: "v1.20.1"
          values:
            installCRDs: true

      ingress-nginx:
        kind: HelmRelease
        spec:
          namespace: ingress-nginx
          chart:
            repo: https://kubernetes.github.io/ingress-nginx
            name: ingress-nginx
            version: "4.15.1"
          values:
            controller:
              hostNetwork: true
              hostPort:
                enabled: true
              service:
                type: ClusterIP

      zenith-server:
        kind: HelmRelease
        spec:
          namespace: azimuth
          chart:
            repo: https://azimuth-cloud.github.io/zenith
            name: zenith-server
            version: "0.17.0"
          values:
            global:
              ingress:
                baseDomain: "${azimuth_cluster_base_domain}"
            registrar:
              config:
                subdomainTokenSigningKey: "${zenith_token_signing_key}"
            sshd:
              replicaCount: 1
              service:
                type: NodePort
                port: 2222
                nodePort: 32222

      azimuth:
        kind: HelmRelease
        spec:
          namespace: azimuth
          chart:
            repo: https://azimuth-cloud.github.io/azimuth
            name: azimuth
            version: "0.20.0"
          values:
            settings:
              secretKey: "${azimuth_django_secret_key}"
            ingress:
              host: "portal.${azimuth_cluster_base_domain}"
            tags:
              apps: true
            apps:
              baseDomain: "${azimuth_cluster_base_domain}"
              sshdHost: "${azimuth_cluster_base_domain}"
              sshdPort: 32222
              registrarExternalUrl: "https://registrar.${azimuth_cluster_base_domain}"
              registrarAdminUrl: "http://zenith-server-registrar.azimuth.svc.cluster.local"
            authentication:
              type: openstack
              openstack:
                authUrl: "${openstack_auth_url}"

      # ── Azimuth operators ─────────────────────────────────────────────────────

      azimuth-capi-operator:
        kind: HelmRelease
        spec:
          namespace: azimuth-capi-operator
          chart:
            repo: https://azimuth-cloud.github.io/azimuth-capi-operator
            name: azimuth-capi-operator
            version: "0.18.0"
          values: {}

      azimuth-apps-operator:
        kind: HelmRelease
        spec:
          namespace: azimuth-apps-operator
          chart:
            repo: https://azimuth-cloud.github.io/azimuth-apps-operator
            name: azimuth-apps-operator
            version: "0.4.2"
          values: {}

      azimuth-caas-operator:
        kind: HelmRelease
        spec:
          namespace: azimuth-caas-operator
          chart:
            repo: https://azimuth-cloud.github.io/azimuth-caas-operator
            name: azimuth-caas-operator
            version: "0.20.0"
          values: {}

      azimuth-identity-operator:
        kind: HelmRelease
        spec:
          namespace: azimuth-identity-operator
          chart:
            repo: https://azimuth-cloud.github.io/azimuth-identity-operator
            name: azimuth-identity-operator
            version: "0.10.0"
          values: {}

      azimuth-schedule-operator:
        kind: HelmRelease
        spec:
          namespace: azimuth-schedule-operator
          chart:
            repo: https://azimuth-cloud.github.io/azimuth-schedule-operator
            name: azimuth-schedule-operator
            version: "0.8.0"
          values: {}

      # ── CAPI management addons ────────────────────────────────────────────────

      cluster-api-addon-provider:
        kind: HelmRelease
        spec:
          namespace: capi-addon-provider
          chart:
            repo: https://azimuth-cloud.github.io/cluster-api-addon-provider
            name: cluster-api-addon-provider
            version: "0.11.0"
          values: {}

      cluster-api-janitor-openstack:
        kind: HelmRelease
        spec:
          namespace: capi-janitor-system
          chart:
            repo: https://azimuth-cloud.github.io/cluster-api-janitor-openstack
            name: cluster-api-janitor-openstack
            version: "0.10.6"
          values: {}

      sealed-secrets:
        kind: HelmRelease
        spec:
          namespace: sealed-secrets-system
          chart:
            repo: https://bitnami-labs.github.io/sealed-secrets
            name: sealed-secrets
            version: "2.18.4"
          values: {}

      # ── Auth & UI ─────────────────────────────────────────────────────────────

      dex:
        kind: HelmRelease
        spec:
          namespace: dex
          chart:
            repo: https://charts.dexidp.io
            name: dex
            version: "0.6.4"
          values: {}

      harbor:
        kind: HelmRelease
        spec:
          namespace: harbor
          chart:
            repo: https://helm.goharbor.io
            name: harbor
            version: "1.18.3"
          values: {}

      kubernetes-dashboard:
        kind: HelmRelease
        spec:
          namespace: kubernetes-dashboard
          chart:
            repo: https://kubernetes.github.io/dashboard
            name: kubernetes-dashboard
            version: "7.14.0"
          values: {}

      helm-dashboard:
        kind: HelmRelease
        spec:
          namespace: helm-dashboard
          chart:
            repo: https://helm-charts.komodor.io
            name: helm-dashboard
            version: "2.0.4"
          values: {}
