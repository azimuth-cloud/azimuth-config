---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi-providers
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/apps/capi-providers
  prune: true
  wait: true
  dependsOn:
    - name: apps
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cabpt-controller-manager
      namespace: capi-talos-bootstrap-system
    - apiVersion: apps/v1
      kind: Deployment
      name: cacppt-controller-manager
      namespace: capi-talos-control-plane-system
