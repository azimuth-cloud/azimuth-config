---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi-providers
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/apps/capi-providers
  prune: true
  wait: true
  dependsOn:
    - name: apps
