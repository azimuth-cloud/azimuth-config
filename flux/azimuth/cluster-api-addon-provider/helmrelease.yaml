---
apiVersion: v1
kind: Namespace
metadata:
  name: capi-addon-provider
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cluster-api-addon-provider
  namespace: capi-addon-provider
spec:
  interval: 10m
  chart:
    spec:
      chart: cluster-api-addon-provider
      version: "0.11.0"
      sourceRef:
        kind: HelmRepository
        name: azimuth-cloud-capi-addon-provider
        namespace: flux-system
  values:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
