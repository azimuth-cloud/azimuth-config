---
apiVersion: v1
kind: Namespace
metadata:
  name: openstack-cloud-controller-manager
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openstack-cloud-controller-manager
  namespace: openstack-cloud-controller-manager
spec:
  interval: 10m
  chart:
    spec:
      chart: openstack-cloud-controller-manager
      version: "2.35.0"
      sourceRef:
        kind: HelmRepository
        name: cloud-provider-openstack
        namespace: flux-system
  values:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      - key: node.cloudprovider.kubernetes.io/uninitialized
        value: "true"
        effect: NoSchedule
    extraVolumes: []
    extraVolumeMounts: []
    cloudConfig:
      global:
        auth-url: "${openstack_auth_url}"
        application-credential-id: "${openstack_application_credential_id}"
        application-credential-secret: "${openstack_application_credential_secret}"
        region: "${openstack_region_name}"
