---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcd-defrag
  namespace: kube-system
spec:
  interval: 10m
  chart:
    spec:
      chart: etcd-defrag
      version: "0.19.0"
      sourceRef:
        kind: HelmRepository
        name: azimuth-cloud-capi-helm-charts
        namespace: flux-system
  values:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
