---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: azimuth
  namespace: azimuth
spec:
  interval: 10m
  dependsOn:
    - name: zenith-server
      namespace: azimuth
    - name: azimuth-capi-operator
      namespace: azimuth
    - name: ingress-nginx
      namespace: ingress-nginx
  chart:
    spec:
      chart: azimuth
      version: "0.20.0"
      sourceRef:
        kind: HelmRepository
        name: azimuth-cloud-azimuth
        namespace: flux-system
  values:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    settings:
      secretKey: "${azimuth_django_secret_key}"
    ingress:
      host: "portal.${base_domain}"
    authentication:
      type: openstack
      openstack:
        authUrl: "${openstack_auth_url}"
