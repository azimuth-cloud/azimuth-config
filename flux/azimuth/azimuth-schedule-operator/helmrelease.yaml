---
apiVersion: v1
kind: Namespace
metadata:
  name: azimuth-schedule-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: azimuth-schedule-operator
  namespace: azimuth-schedule-operator
spec:
  interval: 10m
  chart:
    spec:
      chart: azimuth-schedule-operator
      version: "0.8.0"
      sourceRef:
        kind: HelmRepository
        name: azimuth-cloud-schedule-operator
        namespace: flux-system
  values:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
