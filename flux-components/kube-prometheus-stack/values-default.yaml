apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-prometheus-stack-values-default
  namespace: monitoring-system
data:
  values.yaml: |
    crds:
      enabled: true
    defaultRules:
      disabled:
        # None of these are relevant in k3s context
        KubeSchedulerDown: true
        KubeProxyDown: true
        KubeControllerManagerDown: true
    prometheus:
      prometheusSpec:
        externalUrl: ${ADMIN_DASHBOARD_SCHEME}://prometheus.${DOMAIN}
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
    grafana:
      sidecar:
        dashboards:
          searchNamespace: ALL
      grafana.ini:
        auth.anonymous:
          enabled: true
    alertmanager:
      # Don't apply the namespace grouping by default
      config:
        route:
          group_by:
            - "..."
      alertmanagerSpec:
        externalUrl: ${ADMIN_DASHBOARD_SCHEME}://alertmanager.${DOMAIN}
        # Make sure that alertmanager finds configurations with the alertmanager name as a label
        alertmanagerConfigSelector:
          matchLabels:
            alertmanager: "monitoring-alertmanager"
        # Do NOT add the namespace matcher to routes from AlertmanagerConfig resources
        alertmanagerConfigMatcherStrategy:
          type: None
    kube-state-metrics:
      # Exposes the following metric:
      # kube_customresource_capi_machine_certificate_expiry_timestamp
      # Used for certificate expiry monitoring of Cluster API controlplane Machines.
      rbac:
        extraRules:
          - apiGroups:
              - cluster.x-k8s.io
            resources:
              - machines
            verbs:
              - list
              - watch
      customResourceState:
        enabled: true
        create: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: cluster.x-k8s.io
                  version: v1beta1
                  kind: Machine
                labelsFromPath:
                  namespace:
                    - metadata
                    - namespace
                  cluster_name:
                    - spec
                    - clusterName
                  machine:
                    - metadata
                    - name
                metrics:
                  - name: capi_machine_certificate_expiry_timestamp
                    help: Unix timestamp when the control plane Machine certificates expire
                    each:
                      type: Gauge
                      gauge:
                        path:
                          - status
                          - certificatesExpiryDate
