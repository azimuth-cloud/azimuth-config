apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  type: "oci"
  interval: 15m
  url: oci://ghcr.io/traefik/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
  labels:
    parent-kustomization: traefik
spec:
  interval: 30s
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: ">=v41.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
    remediation:
      retries: 3 # Number of retries before giving up
      remediateLastFailure: true # Automatically remediate the last failure
  upgrade:
    force: true
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
    remediation:
      retries: 3 # Number of retries before giving up
      remediateLastFailure: true # Automatically remediate the last failure
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values-default
    - kind: ConfigMap
      name: traefik-values
      optional: true
