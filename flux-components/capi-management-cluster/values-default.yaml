apiVersion: v1
kind: ConfigMap
metadata:
  name: capi-cluster-values-default
  namespace: default
data:
  values.yaml: |
    cloudCredentialsSecretName: clouds-yaml
    kubernetesVersion: ${kubernetesVersion}
    machineImageId: ${machineImageId}
    machineSSHKeyName: ${sshKeyPair}
    clusterNetworking: {}
    kubeNetwork: {}
    trustedCAs: {}
    registryAuth: {}
    registryMirrors: ""
    apiServer:
      enableLoadBalancer: true
      associateFloatingIP: true
      loadBalancerProvider: ${apiserverLoadbalancerProvider:=}
    controlPlane:
      machineCount: 3
      machineFlavor: ec1.medium
      omitFailureDomain: true
      failureDomains: []
      machineRootVolume: {}
    nodeGroupDefaults:
      failureDomain: null
      machineFlavor: ec1.large
      machineRootVolume:
        diskSize: ${workerRootVolumeSize:=${defaultDiskSize}}
        volumeType: ${workerRootVolumeType:=${defaultVolumeType}}
        availabilityZone: ${workerRootVolumeAvailabilityZone:=${defaultAvailabilityZone}}
      rolloutStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
    nodeGroups:
      - name: "md-0"
        machineFlavor: "ec1.large"
        machineCount: 3
    addons:
      # NFD and the NVIDIA operator are only needed for consuming GPUs
      nodeFeatureDiscovery:
        enabled: false
      nvidiaGPUOperator:
        enabled: false
      # The Mellanox operator is only required for high-performance networking
      mellanoxNetworkOperator:
        enabled: false
      # The NGINX ingress controller is required
      ingress:
        enabled: true
        traefik:
          enabled: false
        nginx:
          enabled: true
          release:
            values:
              controller:
                allowSnippetAnnotations: true
                config:
                  annotations-risk-level: Critical
                service:
                  loadBalancerIP: ${loadBalancerIP}
      # Configure monitoring and alerting
      monitoring:
        enabled: true
        kubePrometheusStack:
          release:
            values:
              # Enable anonymous auth in Grafana
              grafana:
                grafana.ini:
                  auth.anonymous:
                    enabled: true
              alertmanager:
                alertmanagerSpec:
                  externalUrl: ${ADMIN_DASHBOARD_SCHEME}://alertmanager.${DOMAIN}
                  retention: 168h
                  storage:
                    volumeClaimTemplate:
                      spec:
                        resources:
                          requests:
                            storage: 10Gi
              prometheus:
                prometheusSpec:
                  externalUrl: ${ADMIN_DASHBOARD_SCHEME}://prometheus.${DOMAIN}
                  retention: 90d
                  storageSpec:
                    volumeClaimTemplate:
                      spec:
                        resources:
                          requests:
                            storage: 10Gi
              kube-state-metrics:
                rbac:
                  extraRules:
                    - apiGroups:
                        - cluster.x-k8s.io
                      resources:
                        - machines
                      verbs:
                        - list
                        - watch

                customResourceState:
                  enabled: true
                  create: true
                  config:
                    kind: CustomResourceStateMetrics
                    spec:
                      resources:
                        - groupVersionKind:
                            group: cluster.x-k8s.io
                            version: v1beta1
                            kind: Machine

                          labelsFromPath:
                            namespace:
                              - metadata
                              - namespace
                            cluster_name:
                              - spec
                              - clusterName
                            machine:
                              - metadata
                              - name

                          metrics:
                            - name: capi_machine_certificate_expiry_timestamp
                              help: >-
                                Unix timestamp when the control plane Machine
                                certificates expire
                              each:
                                type: Gauge
                                gauge:
                                  path:
                                    - status
                                    - certificatesExpiryDate
              additionalPrometheusRulesMap:
                capi-machine-certificate-expiry:
                  groups:
                    - name: capi_control_plane_certificate_expiry.rules
                      rules:
                        # warning: cert expiry between 21 and 30 days
                        - alert: CAPIMachineCertificateExpiringSoon
                          expr: |
                            (
                              kube_customresource_capi_machine_certificate_expiry_timestamp
                              - time()
                            ) < (30 * 24 * 60 * 60)
                            and
                            (
                              kube_customresource_capi_machine_certificate_expiry_timestamp
                              - time()
                            ) >= (20 * 24 * 60 * 60)
                          for: 15m
                          annotations:
                            summary: Controlplane certificates for {{ "{{" }} $labels.cluster_name {{ "}}" }} expire within 30 days
                            description: |
                              Machine {{ "{{" }} $labels.machine {{ "}}" }} in namespace  {{ "{{" }} $labels.namespace {{ "}}" }} has
                              controlplane certificates expiring within 30 days. Azimuth will automatically replace the affected
                              controlplane Machine when fewer than 21 days remain. No manual action is required unless the replacement fails.
                          labels:
                            severity: warning
                        # critical: if auto replacement failed
                        - alert: CAPIMachineCertificateReplacementOverdue
                          expr: |
                            (
                              kube_customresource_capi_machine_certificate_expiry_timestamp
                              - time()
                            ) <= (20 * 24 * 60 * 60)
                          # controlplane replacement would be longer than 15min
                          for: 1h
                          annotations:
                            summary: Automatic control-plane certificate replacement for {{ "{{" }} $labels.cluster_name {{ "}}" }} may have failed
                            description: |
                              Machine {{ "{{" }} $labels.machine {{ ""}}" }} in namespace {{ "{{" }} $labels.namespace {{ "}}" }} still has
                              certificates expiring within 20 days. Automatic replacement should have started at the 21-day threshold
                              but has not completed. Operator investigation is required.
                          labels:
                            severity: critical
        lokiStack:
          release:
            values:
              loki:
                config:
                  limits_config:
                    retention_period: 744h
                persistence:
                  size: 10Gi
      # Configure the OpenStack integrations
      openstack:
        cloudConfig:
          LoadBalancer: {}
          Metadata: {}
          BlockStorage:
            ignore-volume-az: true
        csiCinder:
          defaultStorageClass:
            availabilityZone: ${csiAvailabillityZone:=${defaultAvailabilityZone}}
            volumeType: ${csiCinderVolumeType:=unencrypted}
    etcd: {}
      # blockDevice:
      #   size: 0
      #   type: Volume
      #   availabilityZone: nova
