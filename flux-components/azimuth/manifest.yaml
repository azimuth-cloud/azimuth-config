apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: azimuth
  namespace: azimuth
spec:
  type: "default"
  interval: 15m
  url: https://azimuth-cloud.github.io/azimuth
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: azimuth
  namespace: azimuth
spec:
  interval: 30s
  releaseName: azimuth
  chart:
    spec:
      chart: azimuth
      version: "0.23.0"
      sourceRef:
        kind: HelmRepository
        name: azimuth
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
    remediation:
      retries: 3 # Number of retries before giving up
      remediateLastFailure: true # Automatically remediate the last failure
  upgrade:
    force: true
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
    remediation:
      retries: 3 # Number of retries before giving up
      remediateLastFailure: true # Automatically remediate the last failure
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: azimuth-values-default
    - kind: ConfigMap
      name: azimuth-values
      optional: true
    - kind: Secret
      name: azimuth-secret-key
      valuesKey: secretKey
      targetPath: settings.secretKeu
