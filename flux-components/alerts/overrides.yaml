- kube-prometheus-stack:
    configMapName: prom-stack-values
    # forceReload: true
    # disabled: true
    values:
      alertmanager:
        templateFiles:
          slack_template.tmpl: |-
            {{ define "cluster" }}{{ .ExternalURL | reReplaceAll ".*alertmanager\\.(.*)" "$1" }}{{ end }}

            {{ define "slack.default.title" }}
              {{- if eq .Status "firing" -}}
                [{{ .GroupLabels.severity | toUpper }}:{{ .Alerts.Firing | len }}]
              {{- else -}}
                [{{ .Status | toUpper }}]
              {{- end }}
              {{ .GroupLabels.alertname }}
            {{ end }}

            {{ define "slack.default.text" }}
              {{- if eq .Status "firing" }}
                {{- with .CommonAnnotations.summary }}
                  *Summary:* {{ . }}
                {{- end }}
              {{- end }}
              {{- with .GroupLabels.namespace }}
                *Namespace:* {{ . }}
              {{- end }}
              {{- if (index .Alerts 0).Labels.pod }}
                *Affected pods*:
                {{- if eq .Status "firing" }}
                  {{- range .Alerts.Firing }}
                    - {{ .Labels.pod }}
                  {{- end }}
                {{- else }}
                  {{- range .Alerts }}
                    - {{ .Labels.pod }}
                  {{- end }}
                {{- end }}
              {{- end }}
              {{- if eq .Status "firing" }}
                {{- range .Alerts.Firing }}
                  {{- if .Annotations.description }}
                    {{- "\n" }}
                    {{ .Annotations.description }}
                  {{- else if .Annotations.message }}
                    {{- "\n" }}
                    {{ .Annotations.message }}
                  {{- end }}
                {{- end }}
                {{- with .CommonAnnotations.runbook_url }}
                  {{- "\n" }}
                  *Runbook URL:* {{ . }}
                {{- end }}
              {{- end }}
            {{ end }}

            {{ define "slack.default.color" }}
              {{- if eq .Status "firing" -}}
                {{- if eq .GroupLabels.severity "warning" -}}
                  warning
                {{- else if eq .GroupLabels.severity "critical" -}}
                  danger
                {{- else -}}
                  #439FE0
                {{- end -}}
              {{- else -}}
                good
              {{- end -}}
            {{ end }}
