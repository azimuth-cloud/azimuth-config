apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: azimuth-caas-operator
  namespace: azimuth
spec:
  type: "default"
  interval: 15m
  url: https://azimuth-cloud.github.io/azimuth-caas-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: azimuth-caas-operator
  namespace: azimuth
spec:
  interval: 30s
  releaseName: azimuth-caas-operator
  chart:
    spec:
      chart: azimuth-caas-operator
      version: "0.22.0"
      sourceRef:
        kind: HelmRepository
        name: azimuth-caas-operator
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
    remediation:
      retries: 3 # Number of retries before giving up
      remediateLastFailure: true # Automatically remediate the last failure
  upgrade:
    force: true
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
    remediation:
      retries: 3 # Number of retries before giving up
      remediateLastFailure: true # Automatically remediate the last failure
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: azimuth-caas-operator-values-default
    - kind: ConfigMap
      name: azimuth-caas-operator-values
      optional: true
