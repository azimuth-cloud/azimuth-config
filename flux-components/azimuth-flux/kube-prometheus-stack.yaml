---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
  namespace: monitoring-system
spec:
  interval: 5m0s
  url:  oci://ghcr.io/azimuth-cloud/azimuth-config/flux/kube-prometheus-stack
  ref:
    tag: latest
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: alerts
  namespace: monitoring-system
spec:
  interval: 5m0s
  url:  oci://ghcr.io/azimuth-cloud/azimuth-config/flux/alerts
  ref:
    tag: latest
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: monitoring-system
  sourceRef:
    kind: OCIRepository
    name: kube-prometheus-stack
    namespace: monitoring-system
  path: "."
  prune: true
  timeout: 1m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-info
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alerts-config
  namespace: monitoring-system
spec:
  interval: 10m
  targetNamespace: monitoring-system
  dependsOn:
    - name: kube-prometheus-stack
      namespace: flux-system
  sourceRef:
    kind: OCIRepository
    name: alerts
  path: "."
  prune: true
  timeout: 1m