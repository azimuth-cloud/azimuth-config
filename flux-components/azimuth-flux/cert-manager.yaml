---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m0s
  url: oci://ghcr.io/azimuth-cloud/azimuth-config/stack-hpc/cert-manager
  ref:
    tag: ${FLUX_ARTIFACT_TAG}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: cert-manager
  sourceRef:
    kind: OCIRepository
    name: cert-manager
    namespace: cert-manager
  path: "./cert-manager"
  prune: true
  timeout: 3m
  retryInterval: 1m
  dependsOn:
    - name: kube-prometheus-stack
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: dynamic-azimuth-info
      - kind: ConfigMap
        name: static-azimuth-info
        optional: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trust-manager
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: cert-manager
  sourceRef:
    kind: OCIRepository
    name: cert-manager
    namespace: cert-manager
  path: "./trust-manager"
  prune: true
  timeout: 1m
  retryInterval: 1m
  dependsOn:
    - name: cert-manager
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: dynamic-azimuth-info
      - kind: ConfigMap
        name: static-azimuth-info
        optional: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-issuer
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: cert-manager
  sourceRef:
    kind: OCIRepository
    name: cert-manager
    namespace: cert-manager
  path: "./objects"
  prune: true
  timeout: 3m
  retryInterval: 1m
  dependsOn:
    - name: trust-manager
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: dynamic-azimuth-info
      - kind: ConfigMap
        name: static-azimuth-info
        optional: true
