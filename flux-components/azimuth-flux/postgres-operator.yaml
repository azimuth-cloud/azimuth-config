---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: postgres-operator
  namespace: postgres-operator
spec:
  interval: 5m0s
  url: oci://ghcr.io/azimuth-cloud/azimuth-config/stack-hpc/postgres-operator
  ref:
    tag: ${FLUX_ARTIFACT_TAG}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres-operator
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: postgres-operator
  sourceRef:
    kind: OCIRepository
    name: postgres-operator
    namespace: postgres-operator
  path: "."
  prune: true
  timeout: 1m
# Do not use postBuild on the whole path as dashboards
# contain ${ ... } expressions that get picked up
