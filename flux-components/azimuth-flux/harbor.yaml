---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 5m0s
  url: oci://ghcr.io/azimuth-cloud/azimuth-config/stack-hpc/harbor
  ref:
    tag: ${FLUX_ARTIFACT_TAG}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: harbor
  sourceRef:
    kind: OCIRepository
    name: harbor
    namespace: harbor
  path: "./harbor"
  prune: true
  timeout: 3m
  dependsOn:
    - name: kube-prometheus-stack
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: dynamic-azimuth-info
      - kind: ConfigMap
        name: static-azimuth-info
        optional: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-dashboards
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: harbor
  sourceRef:
    kind: OCIRepository
    name: harbor
    namespace: harbor
  path: "./dashboards"
  prune: true
  timeout: 3m
  dependsOn:
    - name: kube-prometheus-stack
  # No postBuild for dashboards
